name: pocketedge
description: Local-first edge server framework for Flutter applications.
version: 0.1.6
repository: https://github.com/Nubdubi/pocketedge
topics:
  - flutter
  - dart
  - local-first
  - edge-server
  - offline
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.6.0
  sqlite3_flutter_libs: ^0.6.0+eol
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
